<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Table Converter - TSV, CSV, Gnuplot 변환</title>
<style>
  :root {
    --bg: #0f1117;
    --surface: #1a1d27;
    --surface2: #242836;
    --border: #2e3348;
    --text: #e4e6f0;
    --text-dim: #8b8fa8;
    --accent: #6c8cff;
    --accent-hover: #8da6ff;
    --accent-bg: rgba(108,140,255,0.12);
    --radius: 8px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 24px;
  }

  .container {
    max-width: 1200px;
    margin: 0 auto;
  }

  h1 {
    font-size: 24px;
    margin-bottom: 8px;
  }
  .subtitle {
    color: var(--text-dim);
    font-size: 14px;
    margin-bottom: 24px;
  }
  .subtitle .tip {
    display: inline-block;
    margin-top: 8px;
    padding: 6px 12px;
    background: var(--accent-bg);
    border-radius: var(--radius);
    font-size: 12px;
  }

  .layout {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    gap: 20px;
    align-items: start;
  }
  @media (max-width: 900px) {
    .layout { grid-template-columns: 1fr; }
  }

  .panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
    overflow: hidden;
  }

  .panel-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
    flex-wrap: wrap;
    gap: 8px;
  }
  .panel-title { font-size: 14px; font-weight: 600; }

  select {
    padding: 6px 10px;
    border-radius: var(--radius);
    border: 1px solid var(--border);
    background: var(--surface2);
    color: var(--text);
    font-size: 13px;
    font-family: inherit;
    cursor: pointer;
  }

  textarea {
    width: 100%;
    min-height: 200px;
    padding: 12px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: var(--surface2);
    color: var(--text);
    font-family: 'Consolas', 'Monaco', monospace;
    font-size: 13px;
    line-height: 1.5;
    resize: vertical;
  }
  textarea:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 2px var(--accent-bg);
  }
  textarea::placeholder { color: var(--text-dim); opacity: 0.7; }

  .convert-zone {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
  }

  .btn {
    padding: 10px 20px;
    border-radius: var(--radius);
    border: 1px solid var(--border);
    background: var(--surface2);
    color: var(--text);
    font-size: 14px;
    cursor: pointer;
    transition: all 0.15s;
    font-family: inherit;
  }
  .btn:hover { border-color: var(--accent); background: var(--accent-bg); }
  .btn-primary {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
    font-weight: 600;
  }
  .btn-primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }

  .btn-copy {
    padding: 6px 12px;
    font-size: 12px;
    margin-top: 8px;
  }

  .transpose-opt {
    display: flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
    font-size: 13px;
    color: var(--text-dim);
    user-select: none;
  }
  .transpose-opt:hover { color: var(--text); }
  .transpose-opt input { cursor: pointer; }

  .error-msg {
    color: #ff6b6b;
    font-size: 12px;
    margin-top: 8px;
  }

  .stats {
    font-size: 12px;
    color: var(--text-dim);
    margin-top: 8px;
  }
</style>
</head>
<body>
<div class="container">
  <h1>Table Converter</h1>
  <p class="subtitle">
    TSV, CSV, Gnuplot 데이터 포맷 간 변환. 스프레드시트(Excel, Google Sheets)에서 복사한 데이터를 여기 <strong>텍스트 영역에 붙여넣기</strong>하면 탭 구분 텍스트로 변환됩니다.
    <span class="tip">💡 이미지로 붙어온다면: 원본에서 Ctrl+C 후 이 페이지의 입력란을 클릭하고 Ctrl+V 하세요. 대부분의 스프레드시트는 plain textarea에 붙여넣을 때 텍스트(탭 구분)로 붙여넣습니다.</span>
  </p>

  <div class="layout">
    <div class="panel">
      <div class="panel-header">
        <span class="panel-title">입력 (Input)</span>
        <select id="inputFormat">
          <option value="auto">자동 감지</option>
          <option value="tsv">TSV (탭 구분)</option>
          <option value="csv">CSV (쉼표 구분)</option>
          <option value="gnuplot">Gnuplot (공백/탭)</option>
        </select>
      </div>
      <textarea id="inputData" placeholder="데이터를 붙여넣거나 입력하세요...&#10;&#10;예시 (TSV):&#10;이름	나이	점수&#10;김철수	25	85&#10;이영희	30	92"></textarea>
      <div class="stats" id="inputStats"></div>
    </div>

    <div class="convert-zone">
      <button class="btn btn-primary" id="btnConvert">⇄ 변환</button>
      <label class="transpose-opt" title="행과 열을 바꿉니다">
        <input type="checkbox" id="chkTranspose">
        <span>🔄 표 전치</span>
      </label>
      <button class="btn" id="btnSwap">↕ 입력↔출력</button>
    </div>

    <div class="panel">
      <div class="panel-header">
        <span class="panel-title">출력 (Output)</span>
        <select id="outputFormat">
          <option value="tsv">TSV (탭 구분)</option>
          <option value="csv">CSV (쉼표 구분)</option>
          <option value="gnuplot">Gnuplot (공백 구분)</option>
        </select>
      </div>
      <textarea id="outputData" readonly placeholder="변환 결과가 여기 표시됩니다"></textarea>
      <div class="stats" id="outputStats"></div>
      <div style="display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap;">
        <button class="btn btn-copy" id="btnCopy">📋 결과 복사</button>
        <button class="btn btn-copy" id="btnDownload">💾 파일로 다운로드</button>
      </div>
      <div class="error-msg" id="errorMsg"></div>
    </div>
  </div>
</div>

<script>
(function() {
  const inputEl = document.getElementById('inputData');
  const outputEl = document.getElementById('outputData');
  const inputFormatEl = document.getElementById('inputFormat');
  const outputFormatEl = document.getElementById('outputFormat');
  const btnConvert = document.getElementById('btnConvert');
  const btnSwap = document.getElementById('btnSwap');
  const btnCopy = document.getElementById('btnCopy');
  const btnDownload = document.getElementById('btnDownload');
  const errorMsg = document.getElementById('errorMsg');
  const inputStats = document.getElementById('inputStats');
  const outputStats = document.getElementById('outputStats');

  // Paste handler: HTML에 <table>이 있을 때만 추출하여 삽입. (Excel 등)
  // VSCode는 text/html+text/plain 둘 다 넣는데, HTML에 table이 없어 extractTableFromHtml이
  // null이면 preventDefault 안 하므로 기본 paste(text/plain)가 그대로 동작.
  inputEl.addEventListener('paste', function(e) {
    const html = e.clipboardData?.getData('text/html');
    if (!html) return;
    const text = extractTableFromHtml(html);
    if (text) {
      e.preventDefault();
      document.execCommand('insertText', false, text);
    }
  });

  function extractTableFromHtml(html) {
    const parser = new DOMParser();
    const doc = parser.parseFromString(html, 'text/html');
    const table = doc.querySelector('table');
    if (!table) return null;
    const rows = table.querySelectorAll('tr');
    const result = [];
    rows.forEach(function(tr) {
      const cells = tr.querySelectorAll('td, th');
      const row = Array.from(cells).map(function(c) { return c.textContent.trim(); });
      result.push(row.join('\t'));
    });
    return result.join('\n');
  }

  function parseCsvLine(line, delimiter) {
    delimiter = delimiter || ',';
    const result = [];
    let current = '';
    let inQuotes = false;
    for (let i = 0; i < line.length; i++) {
      const c = line[i];
      if (c === '"') {
        if (inQuotes && line[i + 1] === '"') {
          current += '"';
          i++;
        } else {
          inQuotes = !inQuotes;
        }
      } else if (c === delimiter && !inQuotes) {
        result.push(current);
        current = '';
      } else {
        current += c;
      }
    }
    result.push(current);
    return result;
  }

  function parseCsv(text) {
    const lines = text.split(/\r?\n/);
    const rows = [];
    lines.forEach(function(line) {
      if (line.trim() === '') return;
      rows.push(parseCsvLine(line, ','));
    });
    return rows;
  }

  function parseTsv(text) {
    const lines = text.split(/\r?\n/);
    const rows = [];
    lines.forEach(function(line) {
      if (line.trim() === '') return;
      rows.push(line.split('\t'));
    });
    return rows;
  }

  function parseGnuplot(text) {
    const lines = text.split(/\r?\n/);
    const rows = [];
    lines.forEach(function(line) {
      const trimmed = line.trim();
      if (trimmed === '' || trimmed.startsWith('#')) return;
      rows.push(trimmed.split(/\s+/));
    });
    return rows;
  }

  function detectFormat(text) {
    const firstLine = text.split(/\r?\n/)[0] || '';
    if (firstLine.includes('"') && firstLine.includes(',')) return 'csv';
    if (firstLine.includes('\t')) return 'tsv';
    if (firstLine.match(/^\s*#/) || firstLine.match(/^\S+\s+\S+/)) return 'gnuplot';
    if (firstLine.includes(',')) return 'csv';
    if (firstLine.includes('\t')) return 'tsv';
    return 'tsv';
  }

  function parse(text, format) {
    const fmt = format === 'auto' ? detectFormat(text) : format;
    if (fmt === 'csv') return parseCsv(text);
    if (fmt === 'tsv') return parseTsv(text);
    if (fmt === 'gnuplot') return parseGnuplot(text);
    return parseTsv(text);
  }

  function escapeCsv(val) {
    const s = String(val);
    if (s.includes(',') || s.includes('"') || s.includes('\n')) {
      return '"' + s.replace(/"/g, '""') + '"';
    }
    return s;
  }

  function toCsv(rows) {
    return rows.map(function(row) {
      return row.map(escapeCsv).join(',');
    }).join('\n');
  }

  function toTsv(rows) {
    return rows.map(function(row) {
      return row.join('\t');
    }).join('\n');
  }

  function toGnuplot(rows) {
    return rows.map(function(row) {
      return row.join(' ');
    }).join('\n');
  }

  function convert(rows, format) {
    if (format === 'csv') return toCsv(rows);
    if (format === 'tsv') return toTsv(rows);
    if (format === 'gnuplot') return toGnuplot(rows);
    return toTsv(rows);
  }

  function transposeRows(rows) {
    if (!rows.length) return rows;
    const maxCols = Math.max.apply(null, rows.map(function(r) { return r.length; }));
    const result = [];
    for (let c = 0; c < maxCols; c++) {
      result.push(rows.map(function(r) { return r[c] ?? ''; }));
    }
    return result;
  }

  function updateStats(el, text, label) {
    if (!text.trim()) {
      el.textContent = '';
      return;
    }
    const lines = text.trim().split(/\r?\n/).filter(function(l) { return l.trim(); });
    const cols = lines[0] ? lines[0].split(/\t|,/).length : 0;
    el.textContent = label + ': ' + lines.length + ' 행 × ' + cols + ' 열';
  }

  function doConvert() {
    errorMsg.textContent = '';
    const text = inputEl.value.trim();
    if (!text) {
      outputEl.value = '';
      outputStats.textContent = '';
      return;
    }
    try {
      const inputFmt = inputFormatEl.value;
      const outputFmt = outputFormatEl.value;
      let rows = parse(text, inputFmt);
      if (!rows.length) {
        outputEl.value = '';
        outputStats.textContent = '';
        return;
      }
      if (document.getElementById('chkTranspose').checked) {
        rows = transposeRows(rows);
      }
      const result = convert(rows, outputFmt);
      outputEl.value = result;
      updateStats(inputStats, text, '입력');
      updateStats(outputStats, result, '출력');
    } catch (e) {
      errorMsg.textContent = '오류: ' + e.message;
      outputEl.value = '';
    }
  }

  document.getElementById('chkTranspose').addEventListener('change', doConvert);
  btnConvert.addEventListener('click', doConvert);
  inputEl.addEventListener('input', doConvert);
  inputFormatEl.addEventListener('change', doConvert);
  outputFormatEl.addEventListener('change', doConvert);

  btnSwap.addEventListener('click', function() {
    const inp = inputEl.value;
    const out = outputEl.value;
    if (out) {
      inputEl.value = out;
      outputEl.value = inp;
      const of = outputFormatEl.value;
      outputFormatEl.value = inputFormatEl.value;
      inputFormatEl.value = of;
      doConvert();
    }
  });

  btnCopy.addEventListener('click', function() {
    outputEl.select();
    document.execCommand('copy');
    btnCopy.textContent = '✓ 복사됨';
    setTimeout(function() { btnCopy.textContent = '📋 결과 복사'; }, 1500);
  });

  btnDownload.addEventListener('click', function() {
    const text = outputEl.value;
    if (!text.trim()) return;
    const fmt = outputFormatEl.value;
    const ext = fmt === 'tsv' ? 'tsv' : fmt === 'csv' ? 'csv' : 'dat';
    const mime = fmt === 'csv' ? 'text/csv' : 'text/plain';
    const bom = fmt === 'csv' ? '\ufeff' : '';
    const blob = new Blob([bom + text], { type: mime + ';charset=utf-8' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'data.' + ext;
    a.click();
    URL.revokeObjectURL(a.href);
  });

  doConvert();
})();
</script>
</body>
</html>
